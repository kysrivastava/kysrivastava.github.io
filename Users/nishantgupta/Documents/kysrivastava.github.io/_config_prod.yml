# Jekyll Production Configuration for Yoshita Srivastava Academic Website
# Optimized for GitHub Pages deployment

title: Yoshita Srivastava
name: Yoshita Srivastava
email: yoshitasrivastava@gmail.com
description: >
  Postdoctoral scholar in RNA structural biology and biochemistry.
  Research focuses on bacterial riboswitches and RNA-Fab interfaces.
baseurl: ""  # Root URL (leave empty for GitHub Pages)
url: "https://kysrivastava.github.io"  # Your GitHub Pages URL
lang: en
locale: en_US

# Author info
author:
  name: Yoshita Srivastava
  email: yoshitasrivastava@gmail.com
  linkedin: https://www.linkedin.com/in/yoshita-srivastava/

# al-folio theme settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  auto_ids: true
  math_engine: katex

# Search functionality
search: false  # Disabled in production for faster builds

# Navigation (automatically generated from _pages)
nav:
  - title: About
    url: /
  - title: Research
    url: /research
  - title: Publications
    url: /publications
  - title: CV
    url: /cv
  - title: Contact
    url: /contact

# Jekyll plugins
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# Excerpt settings
excerpt_separator: <!--more-->

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Build settings
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
include:
  - "README.md"
exclude:
  - "README.md"
  - "LICENSE"
  - "CONTRIBUTING.md"

# Default front matter defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      author: "Yoshita Srivastava"
      permalink: /:title/
      show_social: true

# Performance optimizations
exclude_from_layouts:
  - "404.html"
  - "sitemap.xml"

# RSS feed settings
feed:
  path: /feed.xml
  limit: 20

# Sitemap settings
sitemap:
  file: "/sitemap.xml"
  exclude:
    - "/admin/"
    - "/private/"

# SEO settings
seo_tag:
  type: "Person"
  name: "Yoshita Srivastava"
  location: "Chicago, IL"
  organization: "University of Chicago"
  role: "Postdoctoral Scholar"
  description: "Postdoctoral scholar in RNA structural biology and biochemistry"