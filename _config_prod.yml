# Jekyll Production Configuration for Nishant Gupta's Academic Website
# Optimized for GitHub Pages deployment

title: Nishant Gupta
name: Nishant Gupta
email: nishantgupta.phy@gmail.com
description: >
  Development Engineer with a PhD in Theoretical Physics.
  Research focuses on asymptotic symmetries, holography, and celestial/Carrollian conformal field theories.
baseurl: "" # Root URL (leave empty for GitHub Pages)
url: "https://nisg-phys.github.io" # Your GitHub Pages URL
lang: en
locale: en_US

# Author info
author:
  name: Nishant Gupta
  email: nishantgupta.phy@gmail.com
  linkedin: https://linkedin.com/in/nishantg93

# al-folio theme settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  auto_ids: true
  math_engine: katex

# Search functionality
search: false # Disabled in production for faster builds

# Navigation (automatically generated from _pages)
nav:
  - title: About
    url: /
  - title: Research
    url: /research
  - title: Publications
    url: /publications
  - title: CV
    url: /cv
  - title: Contact
    url: /contact

# Jekyll plugins
plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# Excerpt settings
excerpt_separator: <!--more-->

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Build settings
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
include:
  - "README.md"
exclude:
  - "README.md"
  - "LICENSE"
  - "CONTRIBUTING.md"

# Default front matter defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      author: "Nishant Gupta"
      permalink: /:title/
      show_social: true

# Performance optimizations
exclude_from_layouts:
  - "404.html"
  - "sitemap.xml"

# RSS feed settings
feed:
  path: /feed.xml
  limit: 20

# Sitemap settings
sitemap:
  file: "/sitemap.xml"
  exclude:
    - "/admin/"
    - "/private/"

# SEO settings
seo_tag:
  type: "Person"
  name: "Nishant Gupta"
  location: "Bengaluru, India"
  organization: "eTeam India"
  role: "Development Engineer"
  description: "Development Engineer with a PhD in Theoretical Physics, working on AI systems and celestial holography research"
